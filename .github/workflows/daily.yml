name: daily snapshot

on:
  schedule:
    - cron: "17 13 * * *" # 13:17 UTC, early morning in Dallas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the pipeline
        id: pipeline
        run: python -m pipeline.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the snapshot
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ steps.pipeline.outputs.summary }}
        run: |
          git config user.name "Pranav Modem"
          git config user.email "pranavmodem@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "data: snapshot for $(date -u +%F) (${SUMMARY:-run incomplete})"
          git push || (git pull --rebase origin main && git push)
